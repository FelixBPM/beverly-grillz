<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0805" />
    <title>Beverly Grillz</title>
    <!-- The camp B. Purpose-built at each size rather than downscaled from one
         image: at 16px the padding and corner radius have to be tighter or the
         letter loses most of its pixel budget to empty margin. The .ico is the
         fallback and is also what a browser fetches from /favicon.ico without
         being told to. -->
    <!-- ?v=bg is a cache-buster, not decoration. Chrome keeps favicons in a
         store of its own that ignores Cache-Control, so replacing the file is not
         enough - the URL has to change for the browser to go and look again.
         Bump this string whenever the icon changes (orange -> bg, etc). -->
    <link rel="icon" href="/favicon-32.png?v=bg" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png?v=bg" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon.ico?v=bg" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=bg" />
    <meta name="description" content="Beverly Grillz — Burning Man 2026 camp hub: applications, shifts, packing and camp info." />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #0F0805; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
