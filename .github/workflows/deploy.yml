name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "beverly-grillz 2"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The @supabase/* packages now require Node >= 22; on 20 every
          # install emits EBADENGINE warnings.
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "beverly-grillz 2"
          # Without this the action installed wrangler 3.90.0 -- a major
          # version behind. On 2026-07-31 Cloudflare began returning a 520
          # HTML error page to it ("Received a malformed response from the
          # API") and every deploy failed while the build itself passed.
          wranglerVersion: "4"
